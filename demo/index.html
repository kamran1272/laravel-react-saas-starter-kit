<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS Starter Kit — Live Demo</title>
    <meta name="description" content="Try the Laravel + React SaaS Starter Kit live: sign in with admin@demo.io / password. Runs on an in-memory demo API — no backend needed." />
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",

  </head>
  <body>
    <div id="root"></div>
    <noscript>This demo needs JavaScript enabled.</noscript>
    <script>
    // If the app hasn't rendered anything after 20s (e.g. CDN unreachable),
    // show a friendly message instead of a blank page.
    setTimeout(function(){
      var root = document.getElementById('root');
      if(root && !root.hasChildNodes()){
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f1a;color:#e8edf7;font-family:system-ui,sans-serif;padding:24px;text-align:center">'
          + '<div><h2>Demo could not load</h2>'
          + '<p style="color:#9aa7c4">The demo libraries failed to load. Please check your connection and <a href="" style="color:#61dafb">reload</a>.</p></div></div>';
      }
    }, 20000);
    </script>
  </body>
